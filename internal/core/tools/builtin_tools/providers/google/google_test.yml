name: google_test
label: 谷歌测试工具
description: 这是一个用于验证内置插件动态加载流程的测试工具，会把配置参数连同用户输入一起回显。
params:
  - name: channel
    generate_name: channel
    type: select
    desc: 测试数据的来源渠道
    required: true
    default: web
    options:
      - web
      - image
      - scholar
  - name: limit
    generate_name: limit
    type: number
    desc: 返回内容的条数上限
    required: false
    default: 3
    min: 1
    max: 5
  - name: verbose
    generate_name: verbose
    type: bool
    desc: 是否输出详细过程
    required: false
    default: false
  - name: prefix
    generate_name: prefix
    type: string
    desc: 结果的前缀标记
    required: false
    default: demo
